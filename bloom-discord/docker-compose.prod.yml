# =============================================================================
# Bloom Discord — production stack
# =============================================================================
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Deliberately a separate file from `docker-compose.yml` rather than an
# override of it. The development stack ships a PostgreSQL container with the
# password `bloom`, grants every bot the same database credential, and turns
# on debug logging. Each of those is correct for a laptop and wrong for
# production, and an override file would have inherited all three unless
# somebody remembered to unset them one at a time.
#
# -----------------------------------------------------------------------------
# What this file assumes
# -----------------------------------------------------------------------------
#
# 1. The database is managed and external (Supabase). There is no postgres
#    service here. A production database inside the application's own compose
#    stack shares its fate with the application, which is the opposite of what
#    a database is for.
#
# 2. `database/security/0001_runtime_roles.sql` has been applied, so
#    `bloom_guardian`, `bloom_companion`, `bloom_labs` and `bloom_migrator`
#    exist with their own passwords.
#
# 3. Each service reads its own environment file from `deploy/env/`, holding
#    that bot's Discord token and that bot's database role — and nothing else.
#    Templates are in `deploy/env/*.env.example`; the real files are
#    git-ignored.
#
# -----------------------------------------------------------------------------
# Why four environment files instead of one
# -----------------------------------------------------------------------------
#
# A single `.env` shared by three services puts all three Discord tokens and
# the migration credential into every container. Any one of them being read —
# a crash dump, an exec into a running container, a mounted volume — is then
# all four secrets rather than one. `resolveBotConfig` already narrows this in
# process memory; this is the same boundary at the container edge, where it is
# enforced by the orchestrator rather than by application code.
#
# The migration credential is the sharpest case. `bloom_migrator` can create
# and drop tables. No running bot needs that and none of them gets it.
# =============================================================================

name: bloom-discord-prod

x-bot-common: &bot-common
  image: ${BLOOM_IMAGE:-bloom-discord:latest}
  restart: unless-stopped

  # ── Filesystem ─────────────────────────────────────────────────────────────
  # Nothing writes to disk. Logs go to stdout, state goes to PostgreSQL. A
  # writable filesystem in a container holding bot tokens only ever helps an
  # attacker persist.
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777

  # ── Privileges ─────────────────────────────────────────────────────────────
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Nothing is added back. These processes open outbound TCP connections and
  # listen on an unprivileged port; no capability is required for either.

  # ── Resources ──────────────────────────────────────────────────────────────
  # A bot that leaks memory should be restarted by the orchestrator, not
  # allowed to take the host down with it. The limits are generous for a
  # Node process doing this much work and tight enough to be a real ceiling.
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
      reservations:
        memory: 128M
  pids_limit: 256

  # ── Logs ───────────────────────────────────────────────────────────────────
  # Bounded on disk. Structured JSON on stdout is the contract the platform
  # logger already honours; an unbounded json-file driver is how a quiet host
  # fills its disk three months later.
  logging:
    driver: json-file
    options:
      max-size: '20m'
      max-file: '5'

  # ── Shutdown ───────────────────────────────────────────────────────────────
  # tini forwards SIGTERM, the runtime drains the scheduler and closes the
  # pool. 30 seconds is comfortably longer than the longest job lease release
  # and short enough that a deploy is not held up by a wedged process.
  stop_signal: SIGTERM
  stop_grace_period: 30s

services:
  # ---------------------------------------------------------------------------
  # Migrations
  # ---------------------------------------------------------------------------
  #
  # Behind a profile, so `up -d` does not run it. Schema changes in production
  # are a deliberate, observed step — not something that happens implicitly
  # because someone restarted the stack.
  #
  #   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
  #
  # This is the only service that holds `bloom_migrator`.
  migrate:
    image: ${BLOOM_IMAGE:-bloom-discord:latest}
    profiles: ['migrate']
    env_file: deploy/env/migrate.env
    environment:
      NODE_ENV: production
      BLOOM_ENVIRONMENT: production
    entrypoint: ['/usr/bin/tini', '--']
    command: ['node', 'packages/database/dist/cli/migrate.js']
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '3' }

  # ---------------------------------------------------------------------------
  # The three bots
  # ---------------------------------------------------------------------------
  #
  # Separate services, not one process with three clients. A crash in Guardian
  # must not take the community bot offline, and Guardian is the only one
  # holding Manage Roles — the blast radius of a fault in it is the reason the
  # three-bot split exists at all.

  guardian:
    <<: *bot-common
    container_name: bloom-guardian
    env_file: deploy/env/guardian.env
    environment:
      BOT: guardian
      HEALTH_PORT: '8080'
      NODE_ENV: production
      BLOOM_ENVIRONMENT: production
    ports:
      # Loopback only. Health is for the host's orchestrator and its scrape
      # agent, not for the internet.
      - '127.0.0.1:8080:8080'
    healthcheck:
      # `/ready` rather than `/health`: a container that is running but cannot
      # reach Discord or PostgreSQL is not ready to be sent traffic, and
      # reporting it healthy is the "fake health status" the brief forbids.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  companion:
    <<: *bot-common
    container_name: bloom-companion
    env_file: deploy/env/companion.env
    environment:
      BOT: companion
      HEALTH_PORT: '8081'
      NODE_ENV: production
      BLOOM_ENVIRONMENT: production
    ports:
      - '127.0.0.1:8081:8081'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  labs:
    <<: *bot-common
    container_name: bloom-labs
    env_file: deploy/env/labs.env
    environment:
      BOT: labs
      HEALTH_PORT: '8082'
      NODE_ENV: production
      BLOOM_ENVIRONMENT: production
    ports:
      - '127.0.0.1:8082:8082'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8082/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
